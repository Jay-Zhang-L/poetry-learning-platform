server:
  port: 8080
  tomcat:
    apr:
      enabled: false
    max-http-form-post-size: 200MB

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shici?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useServerPrepStmts=true&cachePrepStmts=true&rewriteBatchedStatements=true
    username: root
    password: 20050719

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      # 文件上传临时目录
      location: ./uploads/temp

  web:
    resources:
      static-locations:
        - classpath:/static/
        - classpath:/public/
        - file:./videos/
        - file:D:/shici-files/
        - file:./uploads/

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shici.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  file-root: D:/shici-files
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

# ========== 文件上传路径配置 ==========
file:
  upload:
    path: D:/shici-files/uploads

# AI 配置（DeepSeek + 智谱）
ai:
  deepseek:
    api-key: sk-365d6a467bb141dc89b32bd6938207dd
    model-url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
    max-tokens: 2048
    temperature: 0.7
  zhipu:
    api-key: 79d928d72199430d92379785f5ee6194.CouRenejMgQBKNii
    model: glm-4-flash
    base-url: https://open.bigmodel.cn/api/paas/v4
  # 图片上传配置
  image:
    upload-dir: ./uploads/
    access-url-prefix: /uploads/
    allowed-types:
      - image/jpeg
      - image/jpg
      - image/png
      - image/gif
      - image/webp
    max-size: 5242880
    subdirs:
      temp: temp
      poems: poems
      ai-generated: ai-generated

# 百度语音配置
baidu:
  speech:
    api-key: fietXVkrIBV5fqOBtbt4ge70
    secret-key: gFILoAPbe0QFn43j2WnMSnmRMGKa4Kay
    dev-pid: 1537

# 通义千问配置
qwen:
  api-key: test

logging:
  level:
    com.shici: info
    com.shici.service: debug
    org.mybatis: info
    org.mybatis.spring: info
    org.apache.catalina.core.AprLifecycleListener: off
    okhttp3: debug
  file:
    name: ./logs/shici-app.log
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"