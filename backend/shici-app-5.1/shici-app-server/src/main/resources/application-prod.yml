server:
  port: 8080
  tomcat:
    apr:
      enabled: false
    max-http-form-post-size: 50MB

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/poetry_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useServerPrepStmts=true&cachePrepStmts=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
      location: /data/shici/uploads/temp

  web:
    resources:
      static-locations:
        - classpath:/static/
        - classpath:/public/
        - file:/data/shici/videos/
        - file:/data/shici/uploads/
        - file:/data/shici/files/

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shici.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  file-root: /data/shici/files
  cors:
    allowed-origins: http://121.199.5.183

file:
  upload:
    path: /data/shici/uploads

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model-url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
    max-tokens: 2048
    temperature: 0.7
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    model: glm-4-flash
    base-url: https://open.bigmodel.cn/api/paas/v4
  image:
    upload-dir: /data/shici/uploads/
    access-url-prefix: /uploads/
    allowed-types:
      - image/jpeg
      - image/jpg
      - image/png
      - image/gif
      - image/webp
    max-size: 5242880
    subdirs:
      temp: temp
      poems: poems
      ai-generated: ai-generated

baidu:
  speech:
    api-key: ${BAIDU_SPEECH_API_KEY:}
    secret-key: ${BAIDU_SPEECH_SECRET_KEY:}
    dev-pid: 1537

qwen:
  api-key: ${QWEN_API_KEY:}

logging:
  level:
    com.shici: info
    com.shici.service: debug
    org.mybatis: info
    org.mybatis.spring: info
    org.apache.catalina.core.AprLifecycleListener: off
    okhttp3: info
  file:
    name: /opt/poetry-backend/logs/shici-app.log
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
